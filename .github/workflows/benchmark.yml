name: Python Windows Benchmarks
on: [push, workflow_dispatch]

env:
  ONLY_GETVALUE: 'True'

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      upgrade_pip: true
      install_pytest: true
      run_pytest: true
    steps:
      - run: printf -- '%s\n' 'Nothing to do.'

  benchmark:
    needs: config
    runs-on: windows-latest
    strategy:
      matrix:
        # Testing latest stable CPython and PyPy versions
        python-version: [
          '3.10',
          '3.11', 
          '3.12', 
          '3.13', 
          '3.14', 
          'pypy-3.10', 
          'pypy-3.11'
        ]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6 # Updated to v6
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6 # Updated to v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit Tests
        run: python tests.py

      - name: Upgrade `pip`
        if: ${{ fromJson(needs.config.outputs.upgrade_pip) }}
        run: python -m pip install --upgrade pip

      - name: Install `pytest`
        if: ${{ fromJson(needs.config.outputs.install_pytest) }}
        run: pip install pytest

      - name: Run `pytest` Tests
        if: ${{ fromJson(needs.config.outputs.run_pytest) }}
        shell: 'bash'
        run: |
          cd sabr
          cp -v sabr_io.py yt_dlp/downloader/sabr/_io.py
          pytest '-Werror' '--tb=short' '--color=yes' \
              test/test_sabr/test_downloader/test_io.py

      - name: Run MemoryView Benchmark
        run: python memoryview.py
