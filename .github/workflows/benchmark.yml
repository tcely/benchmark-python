name: Python Windows Benchmarks
on: [push, workflow_dispatch]

jobs:
  benchmark:
    runs-on: windows-latest
    strategy:
      matrix:
        # Testing latest stable CPython and PyPy versions
        python-version: [
          '3.10',
          '3.11', 
          '3.12', 
          '3.13', 
          '3.14', 
          'pypy-3.10', 
          'pypy-3.11'
        ]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6 # Updated to v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6 # Updated to v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit Tests
        run: python tests.py

      - name: Run MemoryView Benchmark
        run: python memoryview.py
