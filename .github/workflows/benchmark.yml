name: Python Windows Benchmarks
on: [push, workflow_dispatch]

env:
  ONLY_GETVALUE: 'True'

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      upgrade_pip: true
      install_pytest: false
      run_pytest: false
    steps:
      - run: printf -- '%s\n' 'Nothing to do.'

  benchmark:
    needs: config
    runs-on: windows-latest
    strategy:
      matrix:
        # Testing latest stable CPython and PyPy versions
        python-version: [
          '3.10',
          '3.11', 
          '3.12', 
          '3.13', 
          '3.14', 
          'pypy-3.10', 
          'pypy-3.11'
        ]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6 # Updated to v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6 # Updated to v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit Tests
        run: python tests.py

      - name: Upgrade `pip`
        if: ${{ true == needs.config.outputs.upgrade_pip }}
        run: python -m pip install --upgrade pip

      - name: Install `pytest`
        if: ${{ true == needs.config.outputs.install_pytest }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run `pytest` Tests
        if: ${{ true == needs.config.outputs.run_pytest }}
        run: pytest '-Werror' '--tb=short' '--color=yes' test_sabr_io.py

      - name: Run MemoryView Benchmark
        run: python memoryview.py
